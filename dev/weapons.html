<!doctype html><html><body style="margin:0;background:#000"><script type="module">
// Weapon model check: all weapon models side by side, seen from the right (muzzles should point left = -Z).
import * as THREE from 'three';
import { Assets, cloneWeapon } from '/src/render/assets.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1280, 520); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x404850);
s.add(new THREE.AmbientLight(0xffffff, 1)); const d = new THREE.DirectionalLight(0xffffff, 1); d.position.set(1, 1, 0.3); s.add(d);
const a = new Assets(); await a.load();
const ids = ['mg', 'sg', 'gl', 'rl', 'rg'];
ids.forEach((id, i) => {
  const m = cloneWeapon(a, id); m.position.set(0, 40 - (i % 3) * 40, i < 3 ? 30 : -30); s.add(m);
  const mz = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshBasicMaterial({ color: 0xff0000 })); mz.position.copy(m.userData.muzzle); m.add(mz);
});
const cam = new THREE.PerspectiveCamera(40, 1280 / 520, 1, 2000); cam.position.set(150, 0, 0); cam.lookAt(0, 0, 0);
r.render(s, cam); document.title = 'ready';
</script></body></html>
